general {
    hide_cursor = true
}
background {
    path = ~/.cache/eva-lock.png
}
label {
    text = $TIME
    font_family = IosevkaTerm Nerd Font Mono
    font_size = 84
    color = rgb(c6a0f6)
    position = 0, 140
    halign = center
    valign = center
}
label {
    text = MAGI · AUTHORISATION REQUIRED
    font_family = IosevkaTerm Nerd Font Mono
    font_size = 13
    color = rgb(8aadf4)
