general {
    hide_cursor = true
}
background {
    path = ~/.cache/eva-lock.png
}
label {
    text = $TIME
    font_family = IosevkaTerm Nerd Font Mono
    font_size = 84
    color = rgb(ff8c1a)
    position = 0, 140
    halign = center
    valign = center
}
label {
    text = NERV · AUTHORISATION REQUIRED
