set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB,alacritty:RGB"

set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

set -g set-titles on
set -g set-titles-string "#I: #W"
set -g renumber-windows on
set -g allow-passthrough on

# Dracula customizations
set -g @dracula-show-powerline true
set -g @dracula-plugins "battery time"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-flags true

set -g @dracula-show-left-icon "▼・ᴥ・▼"
set -g @dracula-left-icon-padding 1

set -g @dracula-military-time true
set -g @dracula-show-location true

# For left
set -g @dracula-show-left-sep "⸗"

# For right symbol (can set any symbol you like as separator)
set -g @dracula-show-right-sep "⸗"

set-window-option -g status-position bottom

set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}"

unbind '%'
bind '|' split-window -h
unbind '"'
bind '-' split-window -v

set -g @custom-cursor-shape off

# Alt/Option binds, handled by tmux so they work in any terminal (Ptyxis etc).
# Mirrors the Alacritty keyboard.bindings that send C-b + key on the Mac.
bind -n M-c new-window
bind -n M-d detach-client
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-w choose-tree -Zw
bind -n M-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind -n M-\\ split-window -h
bind -n M-- split-window -v
bind -n M-\; last-window
bind -n M-"'" command-prompt

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
# Alacritty fires both of its Alt+L bindings, so this does both too.
bind -n M-l { last-window; select-pane -R }
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

bind -n M-0 select-window -t :=0
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
